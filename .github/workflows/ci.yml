
name: DevOps CI Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python --version
          python -m pip install -r requirements.txt

      - name: Run automated tests
        id: tests
        continue-on-error: true
        run: |
          python -m pytest -v --json-report --json-report-file=reports/pytest-report.json

      - name: Generate detailed test report
        if: always()
        run: |
          python scripts/create_report.py

      - name: Send report to local receiver
        if: always()
        run: |
          Invoke-RestMethod -Uri "http://127.0.0.1:5001/report" -Method Post -ContentType "application/json" -InFile "reports/testreport.json"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detailed-test-report
          path: reports/testreport.json

      - name: Mark pipeline as failed if tests failed
        if: steps.tests.outcome == 'failure'
        run: |
          Write-Host "One or more tests failed."
          exit 1

  
  deploy:
    needs: test
    if: success()
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website files
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
